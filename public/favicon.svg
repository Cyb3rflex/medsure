<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2" />
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Glow Base -->
  <rect width="512" height="512" rx="128" fill="#060c18" />

  <!-- Shield Outer Border with Glow -->
  <path d="M256 64 C350 64, 416 110, 416 190 C416 320, 310 400, 256 448 C202 400, 96 320, 96 190 C96 110, 162 64, 256 64 Z" 
        stroke="url(#shieldGrad)" stroke-width="24" stroke-linejoin="round" fill="#0b1528" filter="url(#emeraldGlow)" />

  <!-- Medical Cross / Shield Core -->
  <path d="M224 160 H288 V224 H352 V288 H288 V352 H224 V288 H160 V224 H224 Z" 
        fill="url(#shieldGrad)" opacity="0.35" />

  <!-- Stylized Capsule Pill with Checkmark / Medical Accent -->
  <g transform="translate(256, 256) rotate(-35)">
    <!-- Pill Bottom Half -->
    <rect x="-36" y="-76" width="72" height="76" rx="36" fill="#10b981" />
    <!-- Pill Top Half -->
    <rect x="-36" y="0" width="72" height="76" rx="36" fill="#06b6d4" />
    <!-- Center Dividing Band -->
    <line x1="-36" y1="0" x2="36" y2="0" stroke="#060c18" stroke-width="8" />
    <!-- Pill Inner Highlight Reflection -->
    <path d="M-18 -50 Q-18 -20, -18 0" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Small Verified Badge -->
  <circle cx="360" cy="360" r="42" fill="#10b981" />
  <path d="M342 360 L354 372 L378 348" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
